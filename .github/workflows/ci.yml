name: CI

# Build check for pull requests. Builds only — nothing is packaged or released.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # Linux — same configuration as ./build.sh
  # ============================================================================
  linux:
    name: Linux (x86-64, NXRender)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential ninja-build pkg-config \
            libx11-dev libxrandr-dev libgl-dev libglu1-mesa-dev \
            libfreetype-dev libharfbuzz-dev libwebp-dev \
            libssl-dev libcurl4-openssl-dev zlib1g-dev \
            libsdl2-dev libjson-c-dev

      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DUSE_NXRENDER=ON

      # -k 0: keep going after a failure so one run reports every error
      - name: Build
        run: cmake --build build --parallel $(nproc) -- -k 0

      - name: NXRender tests
        run: ctest --test-dir build/test -R "NxRenderTests|NxPdfTest" --output-on-failure

      # Plays through the null device: no sound hardware on the runner
      - name: NXAudio tests
        run: ctest --test-dir build/source/media/nxaudio --output-on-failure

      # The DevTools models: Rules pane (matched rules, cascade, inherited rules), the
      # Network panel's details (filter, headers, response, timings), Console input
      # (editor, autocomplete, filter), console value formatting, and the Inspector's
      # edit field, DOM edits and search, and forced pseudo-classes
      - name: DevTools tests
        run: ctest --test-dir build/test -R "DevToolsStyleRulesTests|DevToolsNetworkTests|DevToolsConsoleInputTests|WebCoreConsoleFormatTests|DevToolsTextFieldTests|DevToolsDomEditTests|WebCoreForcedPseudoTests" --output-on-failure

      # Keys, typing, focus and forms on the live DOM
      - name: User input tests
        run: ctest --test-dir build/test -R WebCoreUserInputTests --output-on-failure

      # CSS @import: loading imported sheets, their media queries and cascade order
      - name: CSS @import tests
        run: ctest --test-dir build/test -R WebCoreCssImportTests --output-on-failure

      # Layout geometry page scripts read (getBoundingClientRect, offset*, scrolling)
      - name: Script geometry tests
        run: ctest --test-dir build/test -R LayoutGeometryTests --output-on-failure

      # window.getComputedStyle() for page scripts
      - name: Computed style tests
        run: ctest --test-dir build/test -R ComputedStyleTests --output-on-failure

      # Media queries: @media rules as the viewport changes, window.matchMedia()
      - name: Media query tests
        run: ctest --test-dir build/test -R WebCoreMediaQueryTests --output-on-failure

      - name: Custom property tests
        run: ctest --test-dir build/test -R WebCoreCustomPropertyTests --output-on-failure

      # NXNet: URL parsing, HTTP framing, keep-alive and timings against a local
      # server, the DNS cache, request validation, crypto
      - name: Networking tests
        run: ctest --test-dir build/test -R "NxHttpTests|NxHttpSecurityTest|NxCryptoTests" --output-on-failure

      # Hostile HTML/CSS/JS input (hangs, stack overflows) and the live DOM bindings
      - name: Parser robustness and DOM binding tests
        run: ctest --test-dir build/test -R "ParserRobustnessTests|WebCoreDomBindingsTests" --output-on-failure

  # ============================================================================
  # Linux — Debug with AddressSanitizer and UndefinedBehaviorSanitizer
  # Release builds hid a crash on every DNS lookup, use-after-frees in the focus
  # state and in tests, and a heap overflow in the URL parser: only the test
  # targets are built, and every suite runs under the sanitizers.
  # ============================================================================
  linux-sanitizers:
    name: Linux (ASan + UBSan tests)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential ninja-build pkg-config \
            libx11-dev libxrandr-dev libgl-dev libglu1-mesa-dev \
            libfreetype-dev libharfbuzz-dev libwebp-dev \
            libssl-dev libcurl4-openssl-dev zlib1g-dev \
            libsdl2-dev libjson-c-dev

      - name: Configure
        run: >
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DUSE_NXRENDER=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build test targets
        run: >
          cmake --build build --parallel $(nproc) -- -k 0
          nxhttp_tests nxhttp_security_test nxcrypto_tests parser_robustness_tests
          webcore_dom_bindings_tests webcore_layout_tests webcore_user_input_tests
          webcore_forced_pseudo_tests webcore_console_format_tests computed_style_tests
          webcore_media_query_tests webcore_custom_property_tests layout_geometry_tests svg_raster_tests zepra_engine_tests
          devtools_style_rules_tests devtools_network_tests devtools_console_input_tests
          devtools_text_field_tests devtools_dom_edit_tests webcore_css_import_tests
          zeprascript-unit-tests zeprascript-integration-tests

      # Leak reports are off for now: the engine's GC heap is torn down at exit only
      # in part, so every suite would fail on leaks before reaching real errors
      - name: Run tests under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          set -e
          cd build/bin
          for t in nxhttp_tests nxhttp_security_test nxcrypto_tests parser_robustness_tests \
                   webcore_dom_bindings_tests webcore_layout_tests webcore_user_input_tests \
                   webcore_forced_pseudo_tests webcore_console_format_tests computed_style_tests \
                   webcore_media_query_tests webcore_custom_property_tests layout_geometry_tests svg_raster_tests zepra_engine_tests \
                   devtools_style_rules_tests devtools_network_tests devtools_console_input_tests \
                   devtools_text_field_tests devtools_dom_edit_tests webcore_css_import_tests zeprascript-integration-tests; do
            echo "::group::$t"
            timeout 900 ./$t
            echo "::endgroup::"
          done
          # Throughput thresholds are for optimized builds; everything else runs
          timeout 900 ./zeprascript-unit-tests \
            --gtest_filter=-SandboxLoadTests.CheckLimitsOverhead:SandboxLoadTests.IsolatedGlobalLookupSpeed:VMStress.StackThroughput

  # ============================================================================
  # Windows — MSYS2 UCRT64 (GCC), Win32/WGL backend
  # ============================================================================
  windows:
    name: Windows (x86-64, NXRender)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p
            freetype:p harfbuzz:p
            openssl:p curl:p zlib:p

      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DUSE_NXRENDER=ON

      - name: Build
        run: cmake --build build --parallel -- -k 0

      # The DevTools models: Rules pane (matched rules, cascade, inherited rules), the
      # Network panel's details (filter, headers, response, timings), Console input
      # (editor, autocomplete, filter), console value formatting, and the Inspector's
      # edit field, DOM edits and search, and forced pseudo-classes
      - name: DevTools tests
        run: ctest --test-dir build/test -R "DevToolsStyleRulesTests|DevToolsNetworkTests|DevToolsConsoleInputTests|WebCoreConsoleFormatTests|DevToolsTextFieldTests|DevToolsDomEditTests|WebCoreForcedPseudoTests" --output-on-failure

      # Keys, typing, focus and forms on the live DOM
      - name: User input tests
        run: ctest --test-dir build/test -R WebCoreUserInputTests --output-on-failure

      # CSS @import: loading imported sheets, their media queries and cascade order
      - name: CSS @import tests
        run: ctest --test-dir build/test -R WebCoreCssImportTests --output-on-failure

      # Layout geometry page scripts read (getBoundingClientRect, offset*, scrolling)
      - name: Script geometry tests
        run: ctest --test-dir build/test -R LayoutGeometryTests --output-on-failure

      # window.getComputedStyle() for page scripts
      - name: Computed style tests
        run: ctest --test-dir build/test -R ComputedStyleTests --output-on-failure

      # Media queries: @media rules as the viewport changes, window.matchMedia()
      - name: Media query tests
        run: ctest --test-dir build/test -R WebCoreMediaQueryTests --output-on-failure

      - name: Custom property tests
        run: ctest --test-dir build/test -R WebCoreCustomPropertyTests --output-on-failure

  # ============================================================================
  # macOS — Apple Silicon, AppleClang, Cocoa/NSOpenGL backend
  # ============================================================================
  macos:
    name: macOS (arm64, NXRender)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install ninja pkg-config freetype harfbuzz webp openssl@3 json-c

      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DUSE_NXRENDER=ON -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu) -- -k 0

      # The DevTools models: Rules pane (matched rules, cascade, inherited rules), the
      # Network panel's details (filter, headers, response, timings), Console input
      # (editor, autocomplete, filter), console value formatting, and the Inspector's
      # edit field, DOM edits and search, and forced pseudo-classes
      - name: DevTools tests
        run: ctest --test-dir build/test -R "DevToolsStyleRulesTests|DevToolsNetworkTests|DevToolsConsoleInputTests|WebCoreConsoleFormatTests|DevToolsTextFieldTests|DevToolsDomEditTests|WebCoreForcedPseudoTests" --output-on-failure

      # Keys, typing, focus and forms on the live DOM
      - name: User input tests
        run: ctest --test-dir build/test -R WebCoreUserInputTests --output-on-failure

      # CSS @import: loading imported sheets, their media queries and cascade order
      - name: CSS @import tests
        run: ctest --test-dir build/test -R WebCoreCssImportTests --output-on-failure

      # Layout geometry page scripts read (getBoundingClientRect, offset*, scrolling)
      - name: Script geometry tests
        run: ctest --test-dir build/test -R LayoutGeometryTests --output-on-failure

      # window.getComputedStyle() for page scripts
      - name: Computed style tests
        run: ctest --test-dir build/test -R ComputedStyleTests --output-on-failure

      # Media queries: @media rules as the viewport changes, window.matchMedia()
      - name: Media query tests
        run: ctest --test-dir build/test -R WebCoreMediaQueryTests --output-on-failure

      - name: Custom property tests
        run: ctest --test-dir build/test -R WebCoreCustomPropertyTests --output-on-failure
