<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SVG inline</title>
<style>
body { background: #fff; color: #000; font-family: sans-serif; font-size: 12px; margin: 8px; }
.row { display: flex; margin-bottom: 8px; }
.cell { width: 130px; height: 140px; margin-right: 8px; }
.cell p { margin: 2px 0 0 0; }
</style></head><body>
<div class="row">
<div class="cell">
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <rect x="10" y="10" width="60" height="45" fill="#e33" stroke="#333" stroke-width="4"/>
  <circle cx="80" cy="80" r="28" fill="#2a6" stroke="#036" stroke-width="6"/>
  <rect x="14" y="70" width="40" height="40" rx="8" fill="none" stroke="#f80" stroke-width="5"/>
  <line x1="75" y1="10" x2="112" y2="45" stroke="#00f" stroke-width="3" stroke-linecap="round"/>
</svg>
<p>01_fill_stroke</p></div>
<div class="cell">
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" color="#0a7">
  <circle cx="40" cy="40" r="28" fill="currentColor"/>
  <rect x="62" y="62" width="48" height="48" fill="none" stroke="currentColor" stroke-width="6"/>
  <g color="#c0c"><path d="M10 110 L40 70 L70 110 Z" fill="currentColor"/></g>
  <circle cx="90" cy="30" r="20" style="fill:currentColor;opacity:0.5"/>
</svg>
<p>02_currentcolor</p></div>
<div class="cell">
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <rect x="0" y="0" width="40" height="40" fill="rgb(255,128,0)"/>
  <rect x="40" y="0" width="40" height="40" fill="rgb(50%, 20%, 80%)"/>
  <rect x="80" y="0" width="40" height="40" fill="hsl(200, 80%, 50%)"/>
  <rect x="0" y="40" width="40" height="40" fill="rebeccapurple"/>
  <rect x="40" y="40" width="40" height="40" fill="cornflowerblue"/>
  <rect x="80" y="40" width="40" height="40" fill="#abc"/>
  <rect x="0" y="80" width="40" height="40" fill="hsla(120, 100%, 25%, 0.5)"/>
  <rect x="40" y="80" width="40" height="40" fill="rgba(255, 0, 0, 0.25)"/>
  <rect x="80" y="80" width="40" height="40" fill="#11aa3380"/>
</svg>
<p>03_color_syntax</p></div>
<div class="cell">
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <circle cx="40" cy="40" r="30" fill="red" opacity="0.5"/>
  <circle cx="75" cy="40" r="30" fill="blue" fill-opacity="0.5" stroke="black" stroke-width="6" stroke-opacity="0.3"/>
  <g opacity="0.4"><rect x="15" y="70" width="90" height="40" fill="green"/></g>
  <rect x="50" y="62" width="20" height="56" fill="#fff" stroke="#000" stroke-width="2"/>
</svg>
<p>04_opacity</p></div>
<div class="cell">
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="h3">
      <stop offset="0" stop-color="#f00"/>
      <stop offset="0.5" stop-color="#ff0"/>
      <stop offset="1" stop-color="#00f"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#0c0"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.2"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="110" height="50" fill="url(#h3)"/>
  <rect x="5" y="62" width="110" height="53" fill="url(#v)" stroke="url(#h3)" stroke-width="4"/>
</svg>
<p>05_linear_gradient</p></div>
<div class="cell">
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="r1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.4" stop-color="#fc0"/>
      <stop offset="0.8" stop-color="#e40"/>
      <stop offset="1" stop-color="#600"/>
    </radialGradient>
    <radialGradient id="r2" cx="0.5" cy="0.5" r="0.5" fx="0.3" fy="0.3">
      <stop offset="0" stop-color="#9cf"/>
      <stop offset="1" stop-color="#036"/>
    </radialGradient>
  </defs>
  <circle cx="40" cy="40" r="35" fill="url(#r1)"/>
  <rect x="62" y="62" width="54" height="54" fill="url(#r2)"/>
</svg>
<p>06_radial_gradient</p></div>
</div><div class="row">
<div class="cell">
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="g" gradientTransform="rotate(45 0.5 0.5)">
      <stop offset="0" stop-color="#00f"/>
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="1" stop-color="#f00"/>
    </linearGradient>
    <linearGradient id="u" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="120" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#0f0"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="110" height="70" fill="url(#g)"/>
  <rect x="5" y="85" width="50" height="30" fill="url(#u)"/>
  <rect x="65" y="85" width="50" height="30" fill="url(#u)"/>
</svg>
<p>07_gradient_transform</p></div>
<div class="cell">
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <g transform="translate(60 60)">
    <g transform="rotate(45)">
      <rect x="-20" y="-20" width="40" height="40" fill="#e33"/>
    </g>
    <g transform="translate(30, 30) scale(0.5)">
      <circle r="20" fill="#36c"/>
    </g>
    <g transform="matrix(1 0 0.5 1 -50 -50)">
      <rect width="30" height="20" fill="#3a3"/>
    </g>
  </g>
</svg>
<p>08_group_transform</p></div>
<div class="cell">
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="60" viewBox="0 0 20 10">
  <rect width="20" height="10" fill="#eee"/>
  <circle cx="5" cy="5" r="4" fill="#c33"/>
  <rect x="11" y="1" width="8" height="8" fill="#33c"/>
</svg>
<p>09_viewbox</p></div>
<div class="cell">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <circle id="dot" cx="0" cy="0" r="12"/>
    <symbol id="star" viewBox="0 0 20 20">
      <path d="M10 1 L12.6 7 L19 7.3 L14 11.4 L15.8 18 L10 14.2 L4.2 18 L6 11.4 L1 7.3 L7.4 7 Z" fill="#f90"/>
    </symbol>
  </defs>
  <use href="#dot" x="20" y="20" fill="#c00"/>
  <use xlink:href="#dot" x="60" y="20" fill="#0a0"/>
  <use href="#dot" x="100" y="20" style="fill:#00c"/>
  <use href="#star" x="10" y="50" width="60" height="60"/>
  <use href="#star" x="75" y="65" width="40" height="40"/>
</svg>
<p>10_use_defs</p></div>
<div class="cell">
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <polyline points="10,30 40,10 70,30 100,10" fill="none" stroke="#333" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="10,60 40,40 70,60 100,40" fill="none" stroke="#c30" stroke-width="8" stroke-linejoin="miter"/>
  <line x1="10" y1="80" x2="110" y2="80" stroke="#06c" stroke-width="6" stroke-dasharray="12 6"/>
  <path d="M10 110 A 40 20 0 0 1 110 110" fill="none" stroke="#909" stroke-width="4"/>
  <polygon points="85,95 110,95 97,115" fill="#fc0" stroke="#000" stroke-width="2"/>
</svg>
<p>11_strokes</p></div>
<div class="cell" style="color:#d22"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="40" fill="currentColor"/><rect x="10" y="10" width="100" height="100" fill="none" stroke="currentColor" stroke-width="3"/></svg><p>css color</p></div>
</div></body></html>
