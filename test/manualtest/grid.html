<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Grid</title>
<style>
  body { margin: 0; font-family: sans-serif; font-size: 16px; }
  /* A blog layout from named areas, like a WordPress theme's page grid */
  .page { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 64px auto 48px; gap: 12px;
          grid-template-areas: "head head" "side main" "foot foot"; padding: 12px; }
  .page > header { grid-area: head; background: #1a73e8; color: white; padding: 20px; }
  .page > aside { grid-area: side; background: #fbe9e7; padding: 12px; }
  .page > main { grid-area: main; background: #f1f3f4; padding: 12px; }
  .page > footer { grid-area: foot; background: #3c4043; color: white; padding: 14px; }
  /* Responsive cards: as many 180px+ columns as fit */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .card { background: white; border: 1px solid #dadce0; padding: 10px; }
  .card.wide { grid-column: span 2; background: #e6f4ea; }
  /* Fixed, fr and auto tracks with item alignment */
  .tracks { display: grid; grid-template-columns: 100px 1fr 2fr auto; grid-auto-rows: 70px; gap: 8px; margin-top: 12px; }
  .tracks div { background: #fce8b2; padding: 4px; }
  .tracks .c { justify-self: center; align-self: center; background: #a8dab5; }
  .tracks .e { justify-self: end; align-self: end; background: #f6aea9; }
  .tracks .tall { grid-row: span 2; background: #c6dafc; }
</style>
</head>
<body>
<div class="page">
  <header>Site title (grid-area: head)</header>
  <aside>Sidebar (220px)</aside>
  <main>
    <div class="cards">
      <div class="card">Card 1</div>
      <div class="card wide">Card 2 spans two columns</div>
      <div class="card">Card 3</div>
      <div class="card">Card 4</div>
      <div class="card">Card 5</div>
      <div class="card">Card 6</div>
    </div>
    <div class="tracks">
      <div>100px</div>
      <div class="c">1fr centred</div>
      <div class="e">2fr end</div>
      <div class="tall">auto, 2 rows</div>
      <div>next row</div>
      <div>auto-placed</div>
      <div class="c">here</div>
    </div>
  </main>
  <footer>Footer (grid-area: foot)</footer>
</div>
</body>
</html>
